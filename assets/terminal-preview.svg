<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" role="img" aria-labelledby="title description">
  <title id="title">Auto-AI-Chat-Assistant terminal preview</title>
  <desc id="description">An illustrative terminal chat showing a user asking for help and Gemini responding.</desc>
  <rect width="900" height="570" rx="18" fill="#0d1117"/>
  <path d="M18 0h864a18 18 0 0 1 18 18v46H0V18A18 18 0 0 1 18 0z" fill="#161b22"/>
  <circle cx="30" cy="32" r="7" fill="#ff5f57"/>
  <circle cx="54" cy="32" r="7" fill="#febc2e"/>
  <circle cx="78" cy="32" r="7" fill="#28c840"/>
  <text x="450" y="37" fill="#c9d1d9" font-family="Consolas, 'Courier New', monospace" font-size="15" text-anchor="middle">Auto-AI-Chat-Assistant</text>
  <g font-family="Consolas, 'Courier New', monospace">
    <text x="36" y="103" fill="#8b949e" font-size="15">========================================================================</text>
    <text x="36" y="132" fill="#e6edf3" font-size="16">  GEMINI CHATBOT  |  Type 'exit' or 'quit' to end the conversation</text>
    <text x="36" y="161" fill="#8b949e" font-size="15">========================================================================</text>
    <text x="36" y="207" fill="#8b949e" font-size="16">Message &gt; </text>
    <text x="148" y="207" fill="#e6edf3" font-size="16">What can you help me with?</text>
    <text x="36" y="247" fill="#8b949e" font-size="15">------------------------------------------------------------------------</text>
    <text x="52" y="275" fill="#56d4dd" font-size="16" font-weight="700">YOU</text>
    <text x="36" y="299" fill="#8b949e" font-size="15">------------------------------------------------------------------------</text>
    <text x="52" y="327" fill="#d1d7e0" font-size="16">What can you help me with?</text>
    <text x="36" y="351" fill="#8b949e" font-size="15">------------------------------------------------------------------------</text>
    <text x="36" y="389" fill="#8b949e" font-size="16">  Gemini is thinking...</text>
    <text x="36" y="429" fill="#8b949e" font-size="15">------------------------------------------------------------------------</text>
    <text x="52" y="457" fill="#3fb950" font-size="16" font-weight="700">GEMINI</text>
    <text x="36" y="481" fill="#8b949e" font-size="15">------------------------------------------------------------------------</text>
    <text x="52" y="509" fill="#d1d7e0" font-size="16">I can answer questions, explain ideas, and help you work through tasks.</text>
    <text x="36" y="533" fill="#8b949e" font-size="15">------------------------------------------------------------------------</text>
  </g>
</svg>
